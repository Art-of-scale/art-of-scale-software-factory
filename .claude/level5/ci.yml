# Copied to .github/workflows/ci.yml by sf-level (Level 5). Checks every pull request independently of the agent.
name: Factory checks
on:
  pull_request:
    branches: [main]
jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Tests (if the factory has them)
        run: if npm run | grep -q " test"; then npm test -- --run; else echo "No tests yet"; fi
